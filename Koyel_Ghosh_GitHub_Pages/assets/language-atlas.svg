<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 473" role="img" aria-labelledby="title description">
  <title id="title">A multilingual research atlas</title>
  <desc id="description">Assamese, Bodo, Tamil, and Telugu appear around overlapping icons for text and images.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#21473e"/>
      <stop offset="1" stop-color="#112c27"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#779985" stop-opacity=".21"/>
      <stop offset="1" stop-color="#779985" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c6d6c9" stroke-opacity=".11" stroke-width=".7"/>
    </pattern>
    <pattern id="dots" width="4" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".5" fill="#c3d6c7" opacity=".13"/>
    </pattern>
  </defs>

  <rect width="500" height="473" fill="url(#ink)"/>
  <rect width="500" height="473" fill="url(#dots)"/>
  <ellipse cx="250" cy="226" rx="239" ry="213" fill="url(#glow)"/>
  <path d="M24 24h452v425H24z" fill="none" stroke="#b8c6ad" stroke-opacity=".34"/>
  <path d="M24 37V24h13m426 0h13v13m0 399v13h-13m-426 0H24v-13" fill="none" stroke="#d0ab7e" stroke-width="1.35"/>
  <path d="M24 68h452M24 402h452" fill="none" stroke="#b8c6ad" stroke-opacity=".34"/>
  <rect x="25" y="69" width="450" height="332" fill="url(#grid)"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.65">
    <text x="43" y="50" fill="#e0c59f">LANGUAGE ATLAS</text>
    <text x="456" y="50" fill="#bbcdc0" text-anchor="end">RESEARCH PROFILE</text>
    <text x="43" y="430" fill="#bbcdc0">MULTILINGUAL NLP</text>
    <text x="456" y="430" fill="#e0c59f" text-anchor="end">TEXT + IMAGE</text>
  </g>

  <g fill="none" stroke="#b9c8b6">
    <circle cx="250" cy="235" r="106" opacity=".19"/>
    <circle cx="250" cy="235" r="78" opacity=".24" stroke-dasharray="2 5"/>
    <path d="M250 87v296M39 235h422" opacity=".24" stroke-dasharray="2 5"/>
    <path d="M190 124c-25 26-38 65-38 109 0 45 15 85 39 109m118-218c25 26 39 65 39 109 0 45-15 85-39 109" opacity=".16"/>
  </g>

  <g fill="none" stroke-width="1.45">
    <path d="M152 155h25c30 0 23 44 60 44h13" stroke="#d3a879"/>
    <path d="M348 155h-23c-30 0-25 44-61 44h-14" stroke="#a7c8b4"/>
    <path d="M152 313h25c30 0 23-44 60-44h13" stroke="#a7c8b4"/>
    <path d="M348 313h-23c-30 0-25-44-61-44h-14" stroke="#d3a879"/>
  </g>
  <g stroke-width="1.4" fill="#21463d">
    <circle cx="152" cy="155" r="4.1" stroke="#d3a879"/>
    <circle cx="348" cy="155" r="4.1" stroke="#a7c8b4"/>
    <circle cx="152" cy="313" r="4.1" stroke="#a7c8b4"/>
    <circle cx="348" cy="313" r="4.1" stroke="#d3a879"/>
    <circle cx="250" cy="128" r="3.8" stroke="#a7c8b4"/>
    <circle cx="250" cy="341" r="3.8" stroke="#d3a879"/>
  </g>

  <g font-family="ui-monospace, Consolas, monospace">
    <g transform="translate(49 120)">
      <rect width="102" height="66" rx="2" fill="#1c4037" stroke="#be9c78" stroke-opacity=".72"/>
      <text x="12" y="29" fill="#eed8b5" font-size="23">AS</text>
      <text x="12" y="50" fill="#cbdacf" font-size="9" letter-spacing="1.15">ASSAMESE</text>
    </g>
    <g transform="translate(349 120)">
      <rect width="102" height="66" rx="2" fill="#1c4037" stroke="#96b2a1" stroke-opacity=".72"/>
      <text x="12" y="29" fill="#e2ece0" font-size="23">BRX</text>
      <text x="12" y="50" fill="#cbdacf" font-size="9" letter-spacing="1.15">BODO</text>
    </g>
    <g transform="translate(49 282)">
      <rect width="102" height="66" rx="2" fill="#1c4037" stroke="#96b2a1" stroke-opacity=".72"/>
      <text x="12" y="29" fill="#e2ece0" font-size="23">TA</text>
      <text x="12" y="50" fill="#cbdacf" font-size="9" letter-spacing="1.15">TAMIL</text>
    </g>
    <g transform="translate(349 282)">
      <rect width="102" height="66" rx="2" fill="#1c4037" stroke="#be9c78" stroke-opacity=".72"/>
      <text x="12" y="29" fill="#eed8b5" font-size="23">TE</text>
      <text x="12" y="50" fill="#cbdacf" font-size="9" letter-spacing="1.15">TELUGU</text>
    </g>
  </g>

  <g transform="rotate(-13 225 213)">
    <rect x="192" y="166" width="67" height="86" rx="4" fill="#244e42" stroke="#c4dbcb" stroke-width="1.35"/>
    <path d="M204 183h42m-42 10h34m-34 10h42m-42 10h29m-29 10h39m-39 10h22" stroke="#c4dbcb" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M200 242h12m29 0h10" stroke="#94bca7" stroke-width=".7"/>
  </g>
  <g transform="rotate(12 269 254)">
    <rect x="235" y="208" width="68" height="87" rx="4" fill="#d5b792" stroke="#f0d8b7" stroke-width="1.2"/>
    <rect x="243" y="216" width="52" height="57" rx="1.5" fill="#21463d"/>
    <circle cx="280" cy="233" r="4.5" fill="none" stroke="#f0d8b7" stroke-width="1.1"/>
    <path d="m244 262 13-16 11 12 8-8 19 18" fill="none" stroke="#f0d8b7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M244 281h23m13 0h14" stroke="#385344" stroke-width="1.05" stroke-linecap="round"/>
  </g>

  <g fill="#d4ab80">
    <path d="M250 101v12m-6-6h12m-6 250v12m-6-6h12" fill="none" stroke="#d4ab80" stroke-width=".85"/>
    <circle cx="66" cy="235" r="2" opacity=".75"/>
    <circle cx="434" cy="235" r="2" opacity=".75"/>
